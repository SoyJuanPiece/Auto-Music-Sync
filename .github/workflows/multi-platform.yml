name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest

        #- name: macOS
        #  os: macos-latest

        - name: Android32
          os: ubuntu-latest
          target: Android32

        - name: Android64
          os: ubuntu-latest
          target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: ['package']
    if: github.ref == 'refs/heads/arena/26b30bc9-auto-music-sync'

    steps:
      - name: Download Build Output
        uses: actions/download-artifact@v4
        with:
          name: Build Output
          path: build-output

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-${{ github.run_number }}
          name: Auto Music Sync v1.1.0 (Build ${{ github.run_number }})
          body: |
            ## Auto Music Sync v1.1.0

            Automatically syncs the music if you miss a speed portal.

            ### Changes
            - Updated to Geode 5.11.2
            - Compatible with Geometry Dash 2.2081 (Windows & Android)
            - C++23 required

            ### Installation
            Download the `.geode` file below and install it through the Geode Mod Manager.
          draft: false
          prerelease: false
          files: build-output/*
